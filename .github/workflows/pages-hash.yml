name: Deploy to GitHub Pages (filename-hash)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate UI font
        run: make font

      # 配信用に dist を作る（ソースはそのまま）
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "/node_modules/" \
            --exclude "/.cache/fonts/" \
            --exclude "/fonts/kosugi-maru/subset.mjs" \
            --exclude "dist" \
            ./ dist/

      - name: Hash filenames and update CSS and HTML references
        run: |
          node .github/scripts/hashfilenames.mjs dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Record artifact name
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: ${{ steps.artifact-name.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
